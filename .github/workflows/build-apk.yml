name: Build Android APK

permissions:
  contents: read

on:
  # One nightly build (2:30 AM IST), only if something was committed in the last 24h
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$(git log --since='24 hours ago' --oneline -1)" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # Zulu is reliable for Android SDKs
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          validate-wrappers: false

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Surface Gradle error
        if: failure()
        shell: bash
        run: |
          # Put the real Gradle error into the run's annotations, so it is readable without opening raw logs
          sed -n '/What went wrong/,/\* Try/p' build.log | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=Gradle build failed::/'
          echo

      - name: Report APK size, permissions, exported components
        if: success()
        shell: bash
        run: |
          # Security/perf check: what the shipped APK weighs and what the merged manifest grants
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            echo "::notice title=APK size::$(basename $apk) $(stat -c%s $apk) bytes"
          done
          m=$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "::notice title=Permissions::$(grep -o 'uses-permission[^>]*' $m | grep -o 'android:name="[^"]*"' | cut -d'"' -f2 | sort -u | tr '\n' ' ')"
          echo "::notice title=Exported::$(tr '\n' ' ' < $m | grep -o '<\(activity\|service\|receiver\|provider\)[^>]*>' | grep 'exported="true"' | grep -o 'android:name="[^"]*"' | cut -d'"' -f2 | tr '\n' ' ')"

      - name: Locate and Rename APK
        run: |
          # Find any generated apk files
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p build-artifacts
          cp "$APK_PATH" build-artifacts/power-menu-debug.apk
          echo "APK_READY=build-artifacts/power-menu-debug.apk" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-menu-debug-apk
          path: build-artifacts/power-menu-debug.apk
          retention-days: 1
          if-no-files-found: error
